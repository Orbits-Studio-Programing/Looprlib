[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "Looprlib"
version = "1.1"
authors = [
    { name="Matthew Carter", email="mjcarter002@gmail.com" },
]
description = "This is a quick and easy to use Library for python that adds a bunch of random functions. PLZ don't look at the __init__.py file :)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "requests>=2.28.0",
]